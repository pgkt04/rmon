[package]
name = "rmon"
version = "1.3.0"
edition = "2024"
description = "Terminal system monitor with disk benchmarking"
license = "MIT"
repository = "https://github.com/pgkt04/rmon"

# release binaries get downloaded, so trade build time for size/speed
[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
serde_json = "1.0.151"
thiserror = "2.0.20"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
